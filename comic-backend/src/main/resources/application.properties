spring.application.name=comic-backend
# ===============================
# CẤU HÌNH SERVER SPRING BOOT
# ===============================
# Cổng chạy ứng dụng Backend (React sẽ gọi API vào cổng này)
server.port=${PORT:8080}

# ===============================
# CẤU HÌNH KẾT NỐI DATABASE MYSQL
# ===============================

# --- 1. CẤU HÌNH LOCAL DOCKER (Đã Comment) ---
# spring.datasource.url=jdbc:mysql://localhost:3307/comicWeb?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=password_cua_ban_trong_docker

# --- 2. CẤU HÌNH CLOUD TIDB (Đang Hoạt Động) ---
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&serverTimezone=UTC
spring.datasource.username=3gdJcng6EpH2u5N.root
spring.datasource.password=cYIgqyARqnAtm94U
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CẤU HÌNH JPA & HIBERNATE
# ===============================
# QUAN TRỌNG: Để là "none" vì bạn đã tự chạy file SQL tạo bảng bằng tay rồi.
# Nếu để "update" hoặc "create", Spring Boot có thể sẽ làm loạn các khóa ngoại của bạn.
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL trong Console để dễ debug lúc code
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate Batch Insert — Gom nhiều INSERT thành 1 lệnh SQL (nhanh gấp 5-10 lần)
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===============================
# CẤU HÌNH CLOUDINARY
# ===============================
cloudinary.cloud-name=comicWeb
cloudinary.api-key=164468354273354
cloudinary.api-secret=dgOzt0hTJDQZ9EFkzhGhi-lx3wg

# ===============================
# CẤU HÌNH TỐI ƯU CÂN BẰNG TẢI (PERFORMANCE TUNING)
# ===============================
# Tối ưu hoá JSON GZIP (Giảm 10 lần dung lượng băng thông)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Cấu hình Tomcat ThreadPool (Giảm cho Render Free 512MB RAM)
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# Cấu hình bể kết nối HikariCP (Giảm cho Render Free 512MB RAM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# CẤU HÌNH TỐI ƯU CHO RENDER FREE TIER
# ===============================
# Lazy initialization giảm RAM + tăng tốc cold start
spring.main.lazy-initialization=true
# Tắt open-in-view để giảm tải connection pool (Mở lại để tránh lỗi LazyInitializationException)
spring.jpa.open-in-view=true
# Giảm timeout để tránh treo request
spring.mvc.async.request-timeout=30000